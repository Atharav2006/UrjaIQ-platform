services:
  - type: web
    name: urjaiq-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./urjaiq.db # In production, switch to postgres URL
      - key: GROQ_API_KEY
        sync: false # Set this manually in Render dashboard
